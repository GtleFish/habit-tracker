name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ─── BACKEND CI ────────────────────────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: habits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Install
      - name: Install dependencies
        working-directory: backend
        run: npm install

      # 2. Lint
      - name: Lint
        working-directory: backend
        run: npm run lint

      # 3. Test
      - name: Test
        working-directory: backend
        env:
          PORT: 3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: habits_test
          NODE_ENV: test
        run: npm test

  # ─── FRONTEND CI ───────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Install
      - name: Install dependencies
        working-directory: frontend
        run: npm install

      # 2. Lint
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # 3. Test
      - name: Test
        working-directory: frontend
        run: npm run test

      # 4. Build
      - name: Build
        working-directory: frontend
        run: npm run build
