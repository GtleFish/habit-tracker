jobs:
  # ===== BACKEND =====
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password_123
          POSTGRES_DB: habits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 5000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres_password_123
      DB_NAME: habits_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      # 1. Install
      - name: Install
        working-directory: backend
        run: npm install

      # 2. Lint
      - name: Lint
        working-directory: backend
        run: npm run lint

      # 3. Test
      - name: Test
        working-directory: backend
        run: npm test

      # 4. Build
      - name: Build
        working-directory: backend
        run: node --check src/server.js

  # ===== FRONTEND =====
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 1. Install
      - name: Install
        working-directory: frontend
        run: npm install

      # 2. Lint
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # 3. Test
      - name: Test
        working-directory: frontend
        run: npm run test

      # 4. Build
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5000
        run: npm run build
